<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Perchance Generator op GitHub Pages</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; text-align: center; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; }
        #output { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; background: #f9f9f9; min-height: 40px; font-size: 18px; }
        iframe { display: none; }
    </style>
</head>
<body>

    <h1>Perchance & GitHub Pages</h1>
    <p>Succesvol geladen via een lokaal logica-bestand!</p>

    <button id="genereerKnop" onclick="genereerTekst()">🎲 Genereer Tekst</button>
    <div id="output">Klik op de knop om te starten...</div>

    <!-- We laden hier het handmatig gedownloade bestand in -->
    <iframe id="logicaIframe" src="generator-logica.html"></iframe>

    <script>
        function genereerTekst() {
            const iframe = document.getElementById('logicaIframe');
            
            // Controleer of het iframe en de Perchance-structuur (window.root) klaarstaan
            if (iframe && iframe.contentWindow && iframe.contentWindow.root) {
                const root = iframe.contentWindow.root;
                let resultaat = "";

                // Zoek naar de tekstlijst binnen de gedownloade generator
                if (root.output) {
                    resultaat = root.output.toString();
                } else if (root.main) {
                    resultaat = root.main.toString();
                } else {
                    // Fallback naar de allereerste beschikbare lijst
                    const beschikbareLijsten = Object.keys(root).filter(key => typeof root[key] === 'object');
                    if (beschikbareLijsten.length > 0) {
                        resultaat = root[beschikbareLijsten[0]].toString();
                    }
                }

                document.getElementById('output').innerText = resultaat || "Geen tekst gevonden.";
            } else {
                document.getElementById('output').innerText = "Fout: De generator-logica is nog aan het laden...";
            }
        }
    </script>

</body>
</html>
