<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Perchance Generator op GitHub Pages</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; text-align: center; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; }
        #output { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; background: #f9f9f9; min-height: 40px; font-size: 18px; line-height: 1.5; }
    </style>
</head>
<body>

    <h1>Mijn Diervriendelijke Generator</h1>
    <p>100% lokaal uitgevoerd op GitHub Pages (Zonder CORS-fouten!).</p>

    <button id="genereerKnop" onclick="genereerZin()">🎲 Genereer Tekst</button>
    <div id="output">Klik op de knop om een zin te maken...</div>

    <script>
        // --- DE PERCHANCE DATA (Rechtstreeks gekopieerd uit de generator) ---
        const data = {
            dier: [
                "een pluizige kat", "een trouwe hond", "een nieuwsgierige vogel", 
                "an brutale aap", "een trage schildpad", "een snelle cheeta"
            ],
            actie: [
                "snoept van een koekje", "speelt in de achtertuin", "doet een dutje op de bank",
                "kijkt naar de sterren", "maakt een gekke sprong", "luistert naar muziek"
            ],
            locatie: [
                "in de ruimte", "op de Noordpool", "in het diepe oerwoud", 
                "onder de keukentafel", "op een onbewoond eiland"
            ]
        };

        // De logica hoe de zin moet worden opgebouwd
        function maakWillekeurigeZin() {
            const dier = kiesWillekeurig(data.dier);
            const actie = kiesWillekeurig(data.actie);
            const locatie = kiesWillekeurig(data.locatie);
            
            // Dit is het sjabloon (de 'output' zin)
            return `${dier} ${actie} ${locatie}.`;
        }

        // --- DE LOGICA OM DE KOP TE BEDIENEN ---
        function genereerZin() {
            const resultaat = maakWillekeurigeZin();
            document.getElementById('output').innerText = resultaat;
        }

        // Helper-functie om een willekeurig item uit een lijst te kiezen
        function kiesWillekeurig(lijst) {
            const index = Math.floor(Math.random() * lijst.length);
            return lijst[index];
        }
    </script>

</body>
</html>
