<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perchance API op GitHub Pages</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; text-align: center; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; }
        button:disabled { background-color: #ccc; }
        #output { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; background: #f9f9f9; min-height: 40px; font-size: 18px; }
    </style>
</head>
<body>

    <h1>Perchance & GitHub Pages</h1>
    <p>Geladen via de officiële Perchance JSONP-methode (Geen proxy nodig!).</p>

    <button id="genereerKnop" onclick="genereerTekst()" disabled>Laden van Perchance...</button>
    <div id="output">De tekst verschijnt hier...</div>

    <script>
        // Vul hier de naam van jouw gewenste Perchance generator in
        const generatorNaam = "animal-sentence"; 

        let generatorLijsten = null;

        // Deze functie wordt AUTOMATISCH aangeroepen zodra Perchance de data terugstuurt
        window.ontvangPerchanceData = function(data) {
            generatorLijsten = data;
            
            // Activeer de knop
            const knop = document.getElementById('genereerKnop');
            knop.disabled = false;
            knop.innerText = "🎲 Genereer Tekst";
            document.getElementById('output').innerText = "Generator succesvol geladen!";
        };

        // We laden de generator via een script-tag (dit omzeilt alle CORS-blokkades)
        function laadGeneratorViaJsonp() {
            const script = document.createElement('script');
            // We vragen Perchance om de data te verpakken in onze 'ontvangPerchanceData' functie
            script.src = `https://perchance.org{generatorNaam}&callback=ontvangPerchanceData`;
            
            script.onerror = function() {
                document.getElementById('output').innerText = "Fout: Kon de generator niet ophalen van Perchance.";
            };

            document.body.appendChild(script);
        }

        function genereerTekst() {
            if (!generatorLijsten || !generatorLijsten.lists) return;

            const lijsten = generatorLijsten.lists;
            let resultaat = "";

            // Perchance text-generators kiezen standaard uit de 'output' of 'main' lijst
            if (lijsten.output) {
                resultaat = kiesWillekeurig(lijsten.output);
            } else if (lijsten.main) {
                resultaat = kiesWillekeurig(lijsten.main);
            } else {
                // Pak de allereerste lijst die beschikbaar is als fallback
                const sleutels = Object.keys(lijsten);
                if (sleutels.length > 0) {
                    resultaat = kiesWillekeurig(lijsten[sleutels[0]]);
                }
            }

            document.getElementById('output').innerText = resultaat;
        }

        // Helper-functie om een willekeurig item uit de Perchance-lijst-array te vissen
        function kiesWillekeurig(lijstArray) {
            if (!Array.isArray(lijstArray)) return String(lijstArray);
            
            // Filter lege regels of meta-data eruit
            const opgeschoondeLijst = lijstArray.filter(item => item && typeof item === 'string');
            
            if (opgeschoondeLijst.length === 0) return "Lege lijst";
            const willekeurigeIndex = Math.floor(Math.random() * opgeschoondeLijst.length);
            
            return opgeschoondeLijst[willekeurigeIndex];
        }

        // Start het inladen direct zodra de pagina opent
        laadGeneratorViaJsonp();
    </script>

</body>
</html>
