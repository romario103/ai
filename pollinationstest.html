<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Eigen AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
        #chatbox { border: 1px solid #ccc; border-radius: 8px; height: 400px; overflow-y: auto; padding: 15px; background: #f9f9f9; margin-bottom: 15px; }
        .bericht { margin-bottom: 15px; padding: 10px; border-radius: 6px; max-width: 80%; }
        .gebruiker { background-color: #d1ecf1; color: #0c5460; margin-left: auto; text-align: right; }
        .ai { background-color: #e2e3e5; color: #383d41; margin-right: auto; text-align: left; white-space: pre-wrap; }
        .input-groep { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

    <h1>Mijn Persoonlijke AI Assistent</h1>
    <p>Stel hier je vragen (Draait lokaal via de Pollinations AI-API).</p>

    <div id="chatbox">
        <div class="bericht ai">Hallo! Ik ben jouw AI-assistent. Waar kan ik je vandaag mee helpen?</div>
    </div>

    <div class="input-groep">
        <input type="text" id="vraagInput" placeholder="Typ je vraag hier..." onkeypress="if(event.key === 'Enter') stuurVraag()">
        <button id="verzendKnop" onclick="stuurVraag()">Verzend</button>
    </div>

    <script>
async function stuurVraag() {
    const inputVeld = document.getElementById('vraagInput');
    const verzendKnop = document.getElementById('verzendKnop');
    const chatbox = document.getElementById('chatbox');
    
    const gebruikersVraag = inputVeld.value.trim();
    if (!gebruikersVraag) return;

    // 1. Toon de vraag van de gebruiker
    chatbox.innerHTML += `<div class="bericht gebruiker">${gebruikersVraag}</div>`;
    inputVeld.value = '';
    chatbox.scrollTop = chatbox.scrollHeight;

    verzendKnop.disabled = true;
    verzendKnop.innerText = "...";

    // 2. Maak 'Typen...' bericht
    const aiBerichtDiv = document.createElement('div');
    aiBerichtDiv.className = 'bericht ai';
    aiBerichtDiv.innerText = 'AI is aan het nadenken...';
    chatbox.appendChild(aiBerichtDiv);
    chatbox.scrollTop = chatbox.scrollHeight;

    try {
        // GEÜPDATE: We gebruiken nu het vernieuwde, stabielere endpoint van gen.pollinations.ai
        const prompt = `Beantwoord de volgende vraag kort in het Nederlands: ${gebruikersVraag}`;
        const apiUrl = `https://pollinations.ai{encodeURIComponent(prompt)}`;
        
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("API fout");
        
        const aiAntwoord = await response.text();

        // 4. Toon het antwoord
        aiBerichtDiv.innerText = aiAntwoord;

    } catch (error) {
        console.error(error);
        aiBerichtDiv.innerText = 'Oeps! De AI-server kon niet worden bereikt. Controleer je internet of adblocker.';
    } finally {
        verzendKnop.disabled = false;
        verzendKnop.innerText = "Verzend";
        chatbox.scrollTop = chatbox.scrollHeight;
    }
}
    </script>

</body>
</html>
