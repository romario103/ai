<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Perchance Client</title>
<style>
    body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f4f4f7;
        color: #222;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
    }
    h1 { font-size: 1.4em; margin-bottom: 0.2em; }
    .sub { color: #666; font-size: 0.9em; margin-bottom: 1.5em; }
    textarea {
        width: 100%; box-sizing: border-box;
        min-height: 90px; padding: 10px;
        font-size: 1em; font-family: inherit;
        border: 1px solid #ccc; border-radius: 6px;
        resize: vertical;
    }
    button {
        margin-top: 10px; padding: 10px 20px;
        font-size: 1em; background: #2563eb; color: white;
        border: none; border-radius: 6px; cursor: pointer;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status {
        margin-top: 20px; padding: 12px 16px;
        border-radius: 6px; font-size: 0.95em; display: none;
    }
    #status.info  { background: #dbeafe; color: #1e40af; display: block; }
    #status.ok    { background: #dcfce7; color: #166534; display: block; }
    #status.error { background: #fee2e2; color: #991b1b; display: block; }
    #resultaat { margin-top: 20px; text-align: center; }
    #resultaat img {
        max-width: 100%; border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    #resultaat .bestandsnaam {
        margin-top: 8px; font-size: 0.85em;
        color: #555; word-break: break-all;
    }
</style>
</head>
<body>

<h1>Afbeelding genereren</h1>
<div class="sub">Voer een prompt in en klik op Genereer.</div>

<textarea id="prompt" placeholder="Bijvoorbeeld: a rabbit radiating angelic light"></textarea>
<div>
    <button id="knop">Genereer</button>
</div>

<div id="status"></div>
<div id="resultaat"></div>

<script>
// Relatieve paden: de client en de API komen van dezelfde server,
// dus we hoeven geen IP-adres in te vullen.

const promptVeld = document.getElementById('prompt');
const knop       = document.getElementById('knop');
const statusDiv  = document.getElementById('status');
const resultaat  = document.getElementById('resultaat');

function toonStatus(type, tekst) {
    statusDiv.className = type;
    statusDiv.textContent = tekst;
}

function wisStatus() {
    statusDiv.className = '';
    statusDiv.textContent = '';
    statusDiv.style.display = 'none';
}

function wisResultaat() {
    resultaat.innerHTML = '';
}

async function genereer() {
    const prompt = promptVeld.value.trim();
    if (!prompt) {
        toonStatus('error', 'Voer eerst een prompt in.');
        return;
    }

    knop.disabled = true;
    wisResultaat();
    toonStatus('info', '⏳ Bezig met genereren… dit kan tot een minuut duren.');

    const startTijd = Date.now();

    try {
        // Relatief pad: /generate
        const url = `/generate?prompt=${encodeURIComponent(prompt)}&raw=1`;
        const response = await fetch(url);

        if (!response.ok) {
            let detail = `HTTP ${response.status}`;
            try {
                const j = await response.json();
                if (j.reden) detail = j.reden;
            } catch (e) {
                try { detail = await response.text(); } catch (e2) {}
            }
            throw new Error(detail);
        }

        const blob = await response.blob();
        const bestandsnaam = response.headers.get('X-Bestandsnaam') || '(onbekend)';
        const seconden = ((Date.now() - startTijd) / 1000).toFixed(1);

        const imgUrl = URL.createObjectURL(blob);
        const img = document.createElement('img');
        img.src = imgUrl;
        img.alt = prompt;
        const naam = document.createElement('div');
        naam.className = 'bestandsnaam';
        naam.textContent = bestandsnaam;
        resultaat.appendChild(img);
        resultaat.appendChild(naam);

        toonStatus('ok', `✅ Klaar in ${seconden} seconden.`);

    } catch (error) {
        toonStatus('error', `❌ Niet gelukt: ${error.message}`);
    } finally {
        knop.disabled = false;
    }
}

knop.addEventListener('click', genereer);

promptVeld.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        genereer();
    }
});
</script>

</body>
</html>
